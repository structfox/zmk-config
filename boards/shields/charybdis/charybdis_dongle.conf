# === 전력 관리 (동글은 USB 전원이므로 슬립 비활성화) ===
# 공통값(USB / ESB / 배터리 등)은 config/charybdis.conf 에서 머지됨.
CONFIG_ZMK_SLEEP=n

# === OLED 디스플레이 ===
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=300000

# === Dongle Display (zmk-dongle-display 모듈) ===
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="center"
CONFIG_ZMK_DONGLE_DISPLAY_WPM=n
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y

# === Input 처리 (peripheral에서 forwarding된 트랙볼/포인터 이벤트 수신용) ===
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# === ESB central 배터리/버퍼 ===
# 좌/우 배터리 정보를 dongle이 polling해서 host에 proxy → macOS BT 패널/OLED에 표시
# (BLE off 시 모듈 Kconfig가 동일 심볼 재정의. role/peripherals 수는 Kconfig.defconfig)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# central RX FIFO (저자 권장값 — 다중 peripheral 수신 버퍼)
CONFIG_ESB_RX_FIFO_SIZE=32
