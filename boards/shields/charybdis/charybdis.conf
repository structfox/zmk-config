# === USB ===
CONFIG_ZMK_USB=y

# === 기본 설정 ===
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# === 디버그 로그 (엄지키/트랙볼 진단용) ===
# CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_ZMK_USB_LOGGING=y

# === 포인팅 ===
# macOS에서 HID Resolution Multiplier로 마우스 입력이 멈추는 문제로 비활성화
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# === 전력 관리 ===
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# ==========================================================================
# === ESB Split Transport (트랙볼 반응속도 향상) ===
# BLE 스택을 들어내고 Nordic ESB(TDMA + FHSS)로 좌/우 peripheral 통신.
# central(dongle)은 USB로만 host에 연결, peripheral은 ESB로만 central에 연결.
# ==========================================================================

# --- BLE 완전 비활성화 + 기본 split transport 제거 ---
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# --- ESB split transport 활성화 (CONFIG_ESB 는 자동 select) ---
CONFIG_ZMK_SPLIT_ESB=y

# --- 모듈 필수 요구치 (src/split/Kconfig help 명시) ---
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48

# --- 무선 파라미터 ---
# 2Mbps PHY (모듈 기본값이지만 명시)
CONFIG_ZMK_SPLIT_ESB_BITRATE_2MBPS=y
# 폴링 레이트 1kHz: peripheral 2개 → 각 반쪽 슬롯이 2ms(=500Hz)마다.
# 기존 BLE 7.5ms(125Hz cap) 대비 4배. 배터리/반응속도 균형점.
CONFIG_ESB_POLLING_RATE_1KHZ=y

# --- 분리형 키보드 배터리 (BLE off 시 모듈 Kconfig가 동일 심볼 재정의) ---
# peripheral 배터리 측정/보고 + dongle이 proxy 해서 host/OLED에 표시
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ==========================================================================
# === [보관] 기존 BLE 튜닝 — ESB 전환으로 무의미해져 비활성화 ===
# 롤백 시 위 ESB 블록을 지우고 아래 주석을 해제할 것.
# CONFIG_BT_CTLR_TX_PWR_PLUS_3=y      # +3 dBm
# CONFIG_BT_CTLR_PHY_2M=y             # 2 Mbps PHY (split 큐 적체 방지)
# CONFIG_BT_GATT_AUTO_UPDATE_MTU=y    # GATT MTU 자동 협상
# CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y  # 딥슬립 후 재연결 개선
# ==========================================================================
