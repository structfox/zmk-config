# ⚠️ 이 파일은 ZMK 빌드에서 머지되지 않습니다.
#
# ZMK는 shield 이름과 일치하는 conf만 머지합니다:
#   - boards/shields/charybdis/charybdis_{left,right,dongle}.conf  (shield별)
#   - config/charybdis.conf                                        (키맵 베이스명, 공통)
# "charybdis" 라는 shield 는 존재하지 않으므로 이 파일은 무시됩니다.
#
# 공통 설정(USB / ESB / 배터리 등)은 → config/charybdis.conf
# 역할별 설정은 → charybdis_{left,right,dongle}.conf
#
# (과거 BLE 튜닝이 여기 있었으나 실제로는 적용된 적 없는 dead config 였음.
#  ESB 전환으로 BLE 자체를 비활성화하여 의미 없어짐.)
