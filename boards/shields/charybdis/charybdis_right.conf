CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

# PMW3610 트랙볼 — Zephyr 4.1 업스트림 입력 드라이버 (pixart,pmw3610)
# badjeff fork(pixart,pmw3610-alt)에서 전환. 모션 IRQ가 엣지 트리거라
# "레벨 stuck → 인터럽트 폭주 → 오른쪽 반쪽 행/재부팅 필요" 실패 모드가 제거됨.
# (DT_HAS_PIXART_PMW3610_ENABLED 면 default y 라 사실상 자동 활성화되지만 명시.)
CONFIG_INPUT_PMW3610=y

# 참고: 업스트림 드라이버는 아래 튜닝 노브를 제공하지 않는다(badjeff fork 전용).
#   - REPORT_INTERVAL_MIN (OTA 리포트 스로틀): 보고 레이트는 센서 RUN 레이트(~125Hz)가 자연 상한.
#   - RUN/REST downshift·sample 타이밍: 센서 하드웨어 기본 절전 스케줄 사용.
#   - INIT_POWER_UP_EXTRA_DELAY_MS: 드라이버 내장 초기화 타이밍 사용.
# 절전은 그대로 동작(force-awake 미설정) → 배터리 손해 없음.
