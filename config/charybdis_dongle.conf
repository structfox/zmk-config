# === 전력 관리 (동글은 USB 전원이므로 슬립 비활성화) ===
# 공통값(USB / BLE / 전력)은 config/charybdis.conf 에서 상속받고,
# 이 파일은 그 뒤에 병합되므로 아래 값들이 공통값을 덮어쓴다.
CONFIG_ZMK_SLEEP=n

# === OLED 디스플레이 ===
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=300000

# === Dongle Display (zmk-dongle-display 모듈) ===
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="center"
CONFIG_ZMK_DONGLE_DISPLAY_WPM=n
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y

# === Input 처리 (peripheral에서 forwarding된 트랙볼/포인터 이벤트 수신용) ===
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# === USB 로깅 (진단용) ===
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y

# === central 전용 (좌/우에서는 Kconfig 심볼이 보이지 않아 여기 둔다) ===
# 포인팅: macOS에서 HID Resolution Multiplier로 마우스 입력이 멈추는 문제로 비활성화
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# 분리형 배터리: 좌/우 배터리를 dongle이 polling해서 host에 proxy → macOS BT 패널/OLED에 표시
# (dongle central + 트랙볼 peripheral 구조라 #3156 트랙볼-central 키 입력 누락 영향 없음)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# PROXY 는 main 에서 꺼져 있던 값(추가 BAS 서비스). 미검증 → 일단 주석.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
