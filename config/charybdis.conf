# charybdis 공통 설정 — charybdis_left / charybdis_right / charybdis_dongle 전부에 적용된다.
#
# 이 파일은 반드시 config/ 에 있어야 한다. boards/shields/charybdis/charybdis.conf 로 두면
# 어떤 빌드에도 병합되지 않는다 — Zephyr(shields.cmake)는 shield 디렉터리에서 shield 이름이
# 정확히 일치하는 .conf 만 병합하고, 빌드되는 shield 는 charybdis_left/right/dongle 뿐이다.
# config/<이름>.conf 는 ZMK 가 app/boards/post_boards_shields.cmake 에서 찾아 병합한다.
#
# 병합 순서(뒤가 이김): boards/shields/charybdis/<shield>.conf
#                     → config/charybdis.conf → config/<shield>.conf
# 역할별로 값이 달라야 하면 config/<shield>.conf 에 쓴다.
# (동글의 ZMK_SLEEP / ZMK_IDLE_TIMEOUT 이 config/charybdis_dongle.conf 에 있는 이유)

# ⚠ 이 파일의 값은 병합되기 전까지 한 번도 적용된 적이 없다. 2026-08-25 전부 동시에 켜서
# 플래시했더니 오른쪽 트랙볼이 죽었다(키는 정상). 그래서 a9d31ce 로 전부 주석 처리해 main 과
# 같은 동작으로 되돌렸고(트랙볼 복귀 확인), 이후 라운드로 나눠 하나씩 켠다.

# === 원래도 켜져 있던 값 (main 과 동일, 동작 변화 없음) ===
CONFIG_ZMK_USB=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 2 Mbps PHY — 좌/우/동글 모두 main 에서 이미 y 였다(명시만 한 것).
CONFIG_BT_CTLR_PHY_2M=y

# === 라운드 A (2026-08-26 활성화) — 저위험 3종. 트랙볼 죽음 의심 목록에 없음 ===

# 재연결 후 central 이 peripheral GATT notification 구독을 못 살려 통신이 끊긴 채
# 복구되지 않는 문제 완화. 검사를 완화만 하므로 새로 막는 경로는 없다.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# +3 dBm: 0 dBm 마진 부족 / +8 dBm 발열·SNR 악화의 절충안
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y

# 오른쪽 IDLE 진입이 30s(ZMK 기본) → 60s 로 늦어진다. 동글은 자기 conf 에서 300s 로 덮는다.
CONFIG_ZMK_IDLE_TIMEOUT=60000

# === 미검증 — 반드시 하나씩만 켜고 플래시할 것 ===

# 라운드 B 예정. 트랙볼 죽음 의심 2순위.
# GATT MTU 자동 협상. 동글에서만 유효(peripheral 은 BT_GATT_CLIENT=n 으로 버려짐)
# → 이것만 켜는 라운드는 동글만 플래시하면 된다.
# central 의 GATT discovery 와 동시에 MTU 교환이 일어난다. ZMK 자신도 "concurrent GATT
# discovery of splits" 때문에 BT_ATT_TX_COUNT 를 10 으로 올린다. 트랙볼 이벤트는 키 위치와
# 다른 characteristic 을 쓰므로 구독 하나만 실패하면 "키는 되는데 트랙볼만 안 됨" 이 나온다.
# CONFIG_BT_GATT_AUTO_UPDATE_MTU=y

# 트랙볼 죽음 의심 1순위. 켜지 않는 것을 권한다.
# ZMK_SLEEP 이 PM_DEVICE / ZMK_PM_DEVICE_SUSPEND_RESUME 를 select 하는데
# (zmk/app/Kconfig:404), badjeff pmw3610 드라이버는 PM 액션이 전부 주석 처리돼 있다
# (src/pmw3610.c:653-665) → suspend 후 센서가 되살아날 방법이 없다.
# 얻는 것은 20분 유휴 후 배터리 절약뿐.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# 별도 판단 필요. CONN + SEC 를 select 하고, SEC 가 BT_SMP_ALLOW_UNAUTH_OVERWRITE →
# ZMK_BLE_PASSKEY_ENTRY 까지 끌고 온다(= 호스트 재페어링 때 패스키 입력을 요구한다.
# 의도한 적 없는 부작용). ZMK 는 EXPERIMENTAL_CONN 이 켜지면 BT_CTLR_PHY_2M 을
# default n 으로 내린다 — 위 PHY_2M=y 와의 조합 주의.
# CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
